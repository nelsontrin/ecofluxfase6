services:
  ecoflux-app:
    image: ${ECOFLUX_IMAGE:-ecoflux:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ecoflux}-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:h2:file:/data/ecoflux-db;DB_CLOSE_ON_EXIT=FALSE
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
    volumes:
      - ecoflux-data:/data
    networks:
      - ecoflux-network
    restart: on-failure

volumes:
  ecoflux-data:
    driver: local

networks:
  ecoflux-network:
    driver: bridge
