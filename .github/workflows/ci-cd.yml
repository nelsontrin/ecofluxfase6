name: EcoFlux CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '17'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes
        run: ./mvnw -B test

      - name: Gerar artefato da aplicação
        run: ./mvnw -B package -DskipTests

      - name: Publicar JAR para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: ecoflux-jar
          path: target/*.jar
          if-no-files-found: error

  publish-image:
    name: Construir e publicar imagem
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir imagem
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy em staging
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Atualizar ambiente remoto
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECOFLUX_IMAGE: ${{ needs.publish-image.outputs.image }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ECOFLUX_IMAGE,DB_PASSWORD,JWT_SECRET,GITHUB_TOKEN
          script_stop: true
          script: |
            set -eu
            umask 077
            APP_DIR='/home/azureuser/ecoflux-staging'
            APP_PORT='8080'
            COMPOSE_PROJECT_NAME='ecoflux-staging'
            DB_USER='sa'
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml" -o docker-compose.yml
            printf '%s\n' \
              "ECOFLUX_IMAGE=$ECOFLUX_IMAGE" \
              "APP_PORT=$APP_PORT" \
              "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" \
              "DB_USER=$DB_USER" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "JWT_SECRET=$JWT_SECRET" > .env
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull ecoflux-app
            docker compose up -d --no-build
            docker compose ps

  deploy-production:
    name: Deploy em produção
    needs: publish-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Atualizar ambiente remoto
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECOFLUX_IMAGE: ${{ needs.publish-image.outputs.image }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ECOFLUX_IMAGE,DB_PASSWORD,JWT_SECRET,GITHUB_TOKEN
          script_stop: true
          script: |
            set -eu
            umask 077
            APP_DIR='/home/azureuser/ecoflux-production'
            APP_PORT='8081'
            COMPOSE_PROJECT_NAME='ecoflux-production'
            DB_USER='sa'
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml" -o docker-compose.yml
            printf '%s\n' \
              "ECOFLUX_IMAGE=$ECOFLUX_IMAGE" \
              "APP_PORT=$APP_PORT" \
              "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" \
              "DB_USER=$DB_USER" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "JWT_SECRET=$JWT_SECRET" > .env
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull ecoflux-app
            docker compose up -d --no-build
            docker compose ps
